<style>
:root{--bg:#f4f7fb;--card:#fff;--tx:#14325a;--mu:#6b7686;--ac:#d22332;--bd:#dbe3ee;--hd:#14325a;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1722;--card:#18222f;--tx:#e8eef7;--mu:#98a4b5;--ac:#ff5a68;--bd:#2a3748;--hd:#0b1119}}
:root[data-theme="dark"]{--bg:#0f1722;--card:#18222f;--tx:#e8eef7;--mu:#98a4b5;--ac:#ff5a68;--bd:#2a3748;--hd:#0b1119}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px}
h1{margin:0;font-size:1.15rem}h1 span{background:var(--ac);color:#fff;border-radius:999px;padding:2px 10px;margin-left:8px;font-size:.95rem}
.cartbtn{background:#fff;color:#14325a;border:0;border-radius:999px;padding:9px 16px;font-weight:700;cursor:pointer;font-size:.95rem}
main{max-width:1100px;margin:0 auto;padding:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;display:flex;flex-direction:column;position:relative}
.card img{width:100%;aspect-ratio:1/1;object-fit:contain;background:#fff;border-radius:10px}
.badge{position:absolute;top:10px;right:10px;background:var(--ac);color:#fff;font-weight:800;border-radius:999px;padding:5px 10px;font-size:.85rem}
.brand{color:var(--mu);font-size:.75rem;text-transform:uppercase;letter-spacing:.04em;margin:10px 0 2px}
.name{font-weight:700;font-size:.95rem;line-height:1.25;flex:1}
.old{color:var(--mu);text-decoration:line-through;font-size:.9rem;margin-top:8px}
.new{color:var(--ac);font-weight:800;font-size:1.35rem}
.buy{margin-top:10px;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:11px;font-weight:700;font-size:.95rem;cursor:pointer}
.buy:active{transform:scale(.98)}
#panel{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:var(--card);border-left:1px solid var(--bd);z-index:20;display:none;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px))}
#panel.open{display:flex}
#panel h2{margin:0 0 10px;font-size:1.1rem;display:flex;justify-content:space-between;align-items:center}
#panel h2 button{border:0;background:none;color:var(--tx);font-size:1.6rem;cursor:pointer}
#lines{flex:1;overflow:auto}
.ln{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd);font-size:.9rem}
.ln b{flex:1}.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:1.15rem;margin:12px 0}
.act{display:grid;gap:8px}
.act button{padding:12px;border-radius:10px;border:0;font-weight:700;cursor:pointer;font-size:.95rem}
#wa{background:#25a244;color:#fff}#cp{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
#msg{width:100%;height:80px;margin-top:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:.8rem;padding:6px;display:none}
.empty{color:var(--mu);padding:20px 0;text-align:center}
</style></head><body>

const cart={};
const fmt=m=>Math.floor(m/1000)+","+String(m%1000).padStart(3,"0")+" DT";
const $=id=>document.getElementById(id);
$("grid").innerHTML=P.map(p=>`<div class="card"><span class="badge">−40 %</span><img src="${p.img}" alt="${p.name}" loading="lazy"><div class="brand">${p.brand}</div><div class="name">${p.name}</div><div class="old">${fmt(p.old)}</div><div class="new">${fmt(p.new)}</div><button class="buy" data-id="${p.id}">Acheter</button></div>`).join("");
$("grid").addEventListener("click",e=>{const b=e.target.closest(".buy");if(!b)return;const id=+b.dataset.id;cart[id]=(cart[id]||0)+1;render();b.textContent="Ajouté ✓";setTimeout(()=>b.textContent="Acheter",900)});
function text(){const l=Object.keys(cart).map(id=>{const p=P[id];return `• ${p.name} (${p.brand}) × ${cart[id]} = ${fmt(p.new*cart[id])}`});return "Bonjour, je souhaite commander :\n"+l.join("\n")+"\nTotal : "+$("total").textContent}
function render(){const ids=Object.keys(cart).filter(i=>cart[i]>0);let n=0,t=0;
$("lines").innerHTML=ids.length?ids.map(id=>{const p=P[id];n+=cart[id];t+=p.new*cart[id];return `<div class="ln"><b>${p.name}</b><span class="q"><button data-d="-1" data-id="${id}">−</button>${cart[id]}<button data-d="1" data-id="${id}">+</button></span><span>${fmt(p.new*cart[id])}</span></div>`}).join(""):'<div class="empty">Votre panier est vide.</div>';
$("cnt").textContent=n;$("total").textContent=fmt(t)}
$("lines").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;cart[b.dataset.id]+=+b.dataset.d;if(cart[b.dataset.id]<=0)delete cart[b.dataset.id];render()});
$("open").onclick=()=>$("panel").classList.add("open");$("close").onclick=()=>$("panel").classList.remove("open");
function ready(){if(!Object.keys(cart).length){alert("Votre panier est vide.");return false}return true}
$("wa").onclick=()=>{if(!ready())return;const t=text();if(WA_NUMBER){window.open("https://wa.me/"+WA_NUMBER+"?text="+encodeURIComponent(t),"_blank")}else{$("msg").style.display="block";$("msg").value=t;$("msg").select()}};
$("cp").onclick=()=>{if(!ready())return;const t=text();$("msg").style.display="block";$("msg").value=t;$("msg").select();try{navigator.clipboard.writeText(t)}catch(e){}};
render();
</script></body></html>
